name: Reparar imágenes de impresoras

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-printer-images.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --quiet pillow requests

      - name: Descargar y convertir imágenes válidas
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import requests
          from PIL import Image

          images = {
              "images/impresoras/creality-k2-combo.webp":
                  "https://cdn03.plentymarkets.com/ioseuwg7moqp/item/images/32968/full/Creality-K2-Combo-32968_3.png",
              "images/impresoras/anycubic-kobra-s1-combo.webp":
                  "https://store.anycubic.com/cdn/shop/files/S1C_cover.jpg?v=1734944134&width=3000",
              "images/impresoras/elegoo-centauri-carbon.webp":
                  "https://b2b.innpro.pl/hpeciai/107d72a34c07ab96a6b6607f093246af/50700_3.jpg",
              "images/impresoras/creality-k1c.webp":
                  "https://www.pbtech.co.nz/imgprod/P/T/PTRCRL0011.jpg?h=2955253005",
              "images/impresoras/anycubic-kobra-x.webp":
                  "https://www.3idea.in/assets/images/products/6117-Product-Image1.png",
              "images/impresoras/flashforge-ad5x.webp":
                  "https://m.media-amazon.com/images/I/610YUfR1J%2BL._AC_US1000_.jpg",
          }

          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; CompraConCriterio/1.0)"
          }

          for dest, url in images.items():
              r = requests.get(url, headers=headers, timeout=45)
              r.raise_for_status()
              im = Image.open(BytesIO(r.content))
              im.load()

              if im.mode not in ("RGB", "RGBA"):
                  im = im.convert("RGBA" if "A" in im.getbands() else "RGB")

              im.thumbnail((1200, 1200), Image.Resampling.LANCZOS)

              Path(dest).parent.mkdir(parents=True, exist_ok=True)
              im.save(dest, "WEBP", quality=86, method=6)
              print(dest, im.size, Path(dest).stat().st_size)

              # Verificación real: reabrir el WebP generado.
              with Image.open(dest) as check:
                  check.verify()
          PY

      - name: Guardar imágenes reparadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/impresoras
          git commit -m "Reparar imágenes de la comparativa de impresoras"
          git push
