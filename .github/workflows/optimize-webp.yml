name: Optimizar imágenes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/optimize-webp.yml"
      - "images/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/optimize-webp.yml"
      - "images/**"
      - "**/*.html"
      - "**/*.css"

permissions:
  contents: write

jobs:
  optimize:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: python -m pip install --quiet pillow

      - name: Convertir y optimizar imágenes pesadas
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          limit = 300_000
          max_side = 1600
          text_exts = {".html", ".css", ".md", ".xml", ".json", ".js", ".mjs", ".yml", ".yaml"}
          converted = []

          for path in list(Path("images").rglob("*")):
              if not path.is_file() or path.suffix.lower() not in {".png", ".jpg", ".jpeg"}:
                  continue
              if path.stat().st_size < limit:
                  continue

              target = path.with_suffix(".webp")
              with Image.open(path) as im:
                  im.load()
                  if im.mode not in ("RGB", "RGBA"):
                      im = im.convert("RGBA" if "A" in im.getbands() else "RGB")
                  im.thumbnail((max_side, max_side), Image.Resampling.LANCZOS)
                  im.save(target, format="WEBP", quality=82, method=6)

              old_ref = path.as_posix()
              new_ref = target.as_posix()
              for text_path in Path(".").rglob("*"):
                  if not text_path.is_file() or ".git" in text_path.parts or text_path.suffix.lower() not in text_exts:
                      continue
                  try:
                      text = text_path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  if old_ref in text:
                      text_path.write_text(text.replace(old_ref, new_ref), encoding="utf-8")

              path.unlink()
              converted.append((old_ref, new_ref))

          for path in Path("images").rglob("*.webp"):
              old = path.read_bytes()
              if len(old) < limit:
                  continue

              with Image.open(path) as im:
                  im.load()
                  im.thumbnail((max_side, max_side), Image.Resampling.LANCZOS)
                  im.save(path, format="WEBP", quality=82, method=6)

              new = path.read_bytes()
              if len(new) >= len(old):
                  path.write_bytes(old)
              else:
                  print(f"{path}: {len(old)} -> {len(new)} bytes")

          for old_ref, new_ref in converted:
              print(f"Convertida: {old_ref} -> {new_ref}")
          PY

      - name: Guardar cambios en la rama
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay imágenes que optimizar"
            exit 0
          fi
          git commit -m "Optimizar imágenes pesadas"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git push origin "HEAD:${{ github.head_ref }}"
          else
            git push
          fi
