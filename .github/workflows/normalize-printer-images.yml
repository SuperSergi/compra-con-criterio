name: Normalizar imágenes impresoras v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/normalize-printer-images.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: python -m pip install --quiet pillow

      - name: Normalizar imágenes
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          sources = {
              "images/impresoras/creality-k2-combo.webp":
                  "images/impresoras/creality-k2-combo-v2.webp",
              "images/impresoras/anycubic-kobra-s1-combo.webp":
                  "images/impresoras/anycubic-kobra-s1-combo-v2.webp",
              "images/impresoras/elegoo-centauri-carbon.webp":
                  "images/impresoras/elegoo-centauri-carbon-v2.webp",
              "images/impresoras/creality-k1c.webp":
                  "images/impresoras/creality-k1c-v2.webp",
              "images/impresoras/anycubic-kobra-x.webp":
                  "images/impresoras/anycubic-kobra-x-v2.webp",
              "images/impresoras/flashforge-ad5x.webp":
                  "images/impresoras/flashforge-ad5x-v2.webp",
          }

          for src, dst in sources.items():
              with Image.open(src) as im:
                  im.load()
                  if im.mode != "RGBA":
                      im = im.convert("RGBA")

                  # Fondo blanco para eliminar transparencias o composiciones problemáticas.
                  bg = Image.new("RGB", im.size, "white")
                  bg.paste(im, mask=im.getchannel("A"))

                  # Tamaño homogéneo y espacio alrededor del producto.
                  bg.thumbnail((1000, 1000), Image.Resampling.LANCZOS)
                  canvas = Image.new("RGB", (1100, 1100), "white")
                  x = (1100 - bg.width) // 2
                  y = (1100 - bg.height) // 2
                  canvas.paste(bg, (x, y))

                  canvas.save(dst, "WEBP", quality=88, method=6)

              with Image.open(dst) as check:
                  check.verify()

              print(dst, Path(dst).stat().st_size)
          PY

      - name: Guardar nuevos archivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/impresoras/*-v2.webp
          git commit -m "Crear imágenes v2 normalizadas de impresoras"
          git push
